name: Update AUR package

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Bump to the latest upstream commit even without a new release tag
        type: boolean
        default: false
      dry_run:
        description: Build and show the diff, but push nothing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-aur
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh

      - uses: actions/checkout@v4

      - name: Check, build and publish
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash .github/scripts/update.sh
        env:
          FORCE: ${{ inputs.force || false }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          GIT_AUTHOR_NAME: dim-ghub
          GIT_AUTHOR_EMAIL: 59436063+dim-ghub@users.noreply.github.com
